        .banner-container {

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
        }

        /* Profile DP Fade Container */
        .profile-container {
            position: relative;
            z-index: 2;
            width: 130px;

            border-radius: 50%;
            border: 4px solid #fff;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);

        }

        .profile-dp {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .profile-dp.active {
            opacity: 1;
        }

    <!-- 3 DP Fade Script (2 sec loop) -->
    <script>
        const dps = document.querySelectorAll('.profile-dp');
        let currentIndex = 0;
